<style>
  :root{ --ink:#1A1A2E; --ink-muted:#5A5A6E; --divider:#E5E5E5; --field:#F5F5F7; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ───────────────────────── Constants ───────────────────────── */
const VIDEO_URL = "./assets/hero-web.mp4"; // self-hosted (was a third-party CloudFront bucket)
// Waitlist capture → Supabase Edge Function (holds the beehiiv key server-side, mirrors Lampengrün).
const SUBSCRIBE_URL = "https://myfgtmmolbrbhqtalauv.supabase.co/functions/v1/mm-subscribe";
const SKIN = ['#F3DEC9','#E7C29A','#C99E70','#9B6A45','#4D2F22'];
const HAIR = ['#0B0A0C','#5C4033','#DEB877','#B5510E','#C9C6C1'];
const BEARDS = [{key:'Clean shaven',label:'Shaven'},{key:'Stubble',label:'Stubble'},{key:'Letting it grow',label:'Growing'},{key:'Sunnah length',label:'Sunnah'}];
const COVERING = ['Hijab','Niqab','Burqa'];
const HIJAB_STYLES = ['Full','Some hair','Loose'];
const DRESSING = ['Jeans','Dresses','Both'];
const BRO_DRESSING = ['Thobe','Western','Both'];
const YESNO = ['Yes','No'];
const ULTRA='#1E3FF5', ROSE='#E84A78', INK='#1A1A2E', INK_MUTED='#5A5A6E', DIVIDER='#E5E5E5', FIELD='#F5F5F7';
const TABS = [["how","How it works"],["revolution","The revolution"],["pricing","Pricing"],["story","Our story"],["blog","Blog"]];

/* ───────────────────────── Glyph (faithful port of app Glyph.tsx) ───────────────────────── */
function Glyph({ skinTone='#C19675', hairColor='#4B3621', covering=null, hijabStyle=null, beard=null, gender=null, size=120 }){
  const isSister = gender === 'sister';
  const hijab = covering==='Hijab', niqab = covering==='Niqab', burqa = covering==='Burqa';
  const hasCovering = isSister && !!covering;
  const k = hijabStyle || 'Full';
  const hijabFringe = hijab && (k==='Some hair' || k==='Loose');
  const hijabNeck = hijab && k==='Loose';
  const cover = ROSE, veil = '#F4A8C6', garment = '#E3E4EC';
  const dHEAD='M50 8 C63 8 73 19 73 33 C73 49 64 63 50 63 C36 63 27 49 27 33 C27 19 37 8 50 8 Z';
  const dNECK='M43 55 L57 55 L60 80 L40 80 Z';
  const dSHO='M10 112 C10 85 27 75 50 75 C73 75 90 85 90 112 Z';
  const dHAIR='M27 35 C25 17 37 7 50 7 C63 7 75 17 73 35 C70 28 64 24 50 24 C36 24 30 28 27 35 Z';
  const dHOOD='M50 2 C73 2 87 18 87 43 C87 66 81 82 75 96 L25 96 C19 82 13 66 13 43 C13 18 27 2 50 2 Z';
  const dNIQF='M27 31 C27 19 36 8 50 8 C64 8 73 19 73 31 Z';
  const dNIQL='M26 39 C28 54 38 63 50 63 C62 63 72 54 74 39 Z';
  const dBURQA='M26 30 L74 30 L74 41 C60 43 40 43 26 41 Z';
  const dLONG='M50 4 C74 4 87 19 87 44 C87 60 84 73 80 80 C64 77 36 77 20 80 C16 73 13 60 13 44 C13 19 26 4 50 4 Z';
  const bb = beard==='Sunnah length'?82:beard==='Letting it grow'?73:65;
  const dBEARD=`M29 43 C31 58 40 ${bb} 50 ${bb} C60 ${bb} 69 58 71 43 C67 50 60 54 50 54 C40 54 33 50 29 43 Z`;
  const showBeard = !isSister && !!beard && beard!=='Clean shaven';
  return (
    <svg width={size} height={size*1.12} viewBox="0 0 100 112" role="img" aria-label={isSister?"Sister avatar":"Brother avatar"}>
      {hasCovering ? (
        <g><path d={dSHO} fill={cover}/><path d={dHOOD} fill={cover}/>
          {hijab && <>{hijabNeck && <path d={dNECK} fill={skinTone}/>}<path d={dHEAD} fill={skinTone}/>{hijabFringe && <path d={dHAIR} fill={hairColor}/>}</>}
          {niqab && <><path d={dHEAD} fill={skinTone}/><path d={dNIQF} fill={cover}/><path d={dNIQL} fill={cover}/></>}
          {burqa && <path d={dBURQA} fill={veil}/>}
        </g>
      ) : isSister ? (
        <g><path d={dSHO} fill={garment}/><path d={dLONG} fill={hairColor}/><path d={dNECK} fill={skinTone}/><path d={dHEAD} fill={skinTone}/><path d={dHAIR} fill={hairColor}/></g>
      ) : (
        <g><path d={dSHO} fill={garment}/><path d={dNECK} fill={skinTone}/><path d={dHEAD} fill={skinTone}/><path d={dHAIR} fill={hairColor}/>{showBeard && <path d={dBEARD} fill={hairColor} opacity={beard==='Stubble'?0.45:1}/>}</g>
      )}
    </svg>
  );
}
const JEANS='M33 14 L67 14 L64 88 L53 88 L50 48 L47 88 L36 88 Z';
const DRESS='M40 12 L60 12 L64 40 L72 88 L28 88 L36 40 Z';
const THOBE='M38 12 L62 12 L66 32 L63 88 L37 88 L34 32 Z';
function DressIcon({ kind, color, female=true }){
  return (<svg width={42} height={42} viewBox="0 0 100 100" aria-hidden="true">
    {(kind==='Jeans'||kind==='Western') ? <path d={JEANS} fill={color}/> : kind==='Dresses' ? <path d={DRESS} fill={color}/> : kind==='Thobe' ? <path d={THOBE} fill={color}/> :
      <><path d={female?DRESS:THOBE} fill={color} transform="translate(-2 22) scale(0.5)"/><path d={JEANS} fill={color} transform="translate(50 22) scale(0.5)"/></>}
  </svg>);
}

/* ───────────────────────── Atoms ───────────────────────── */
function Swatch({ color, selected, onPick, accent }){
  return (<button onClick={onPick} aria-label={"colour "+color} className="rounded-full flex items-center justify-center focus:outline-none"
    style={{ width:32, height:32, border:'2px solid '+(selected?accent:'transparent') }}>
    <span style={{ width:22, height:22, borderRadius:11, background:color, border:'1px solid '+DIVIDER }}/></button>);
}
function Tile({ selected, onPick, accent, label, children, dim=false, clear=false, onClear }){
  return (<button onClick={onPick} className="relative flex-1 flex flex-col items-center justify-center rounded-2xl transition-all"
    style={{ height:78, opacity:dim?0.45:1, border:selected?'2px solid '+accent:'1px solid '+DIVIDER, background:selected?accent+'1F':'#fff' }}>
    <span className="flex items-center justify-center" style={{height:48}}>{children}</span>
    <span className="text-[11px] font-medium leading-none mt-0.5" style={{color:selected?INK:INK_MUTED}}>{label}</span>
    {clear && <span onClick={(e)=>{e.stopPropagation(); onClear&&onClear();}} className="absolute flex items-center justify-center text-white" style={{top:6,left:6,width:18,height:18,borderRadius:9,background:accent,fontSize:9,lineHeight:'11px'}}>✕</span>}
  </button>);
}
function Chip({ label, selected, onPick, accent }){
  return (<button onClick={onPick} className="text-[13px] px-4 py-2.5 rounded-full border transition-all"
    style={ selected ? {background:accent,color:'#fff',borderColor:accent,fontWeight:600} : {background:'#fff',color:INK,borderColor:DIVIDER,fontWeight:500} }>{label}</button>);
}
function FieldLabel({ children }){ return <div className="mono text-[11px] mb-2" style={{color:INK_MUTED, letterSpacing:'0.12em', textTransform:'uppercase'}}>{children}</div>; }

/* content-page atoms */
function Eyebrow({ children, color }){ return <div className="mono text-[11px] mb-2" style={{color:color||ULTRA, letterSpacing:'0.14em', textTransform:'uppercase'}}>{children}</div>; }
function Panel({ children, className }){ return <div className={"backdrop-blur-md rounded-3xl shadow-xl p-6 sm:p-8 "+(className||"")} style={{background:'rgba(255,255,255,0.96)'}}>{children}</div>; }
function H2({ children }){ return <h2 className="display text-2xl sm:text-3xl leading-tight" style={{fontWeight:800, color:INK}}>{children}</h2>; }
function Lead({ children }){ return <p className="text-[15px] sm:text-base leading-relaxed" style={{color:INK_MUTED}}>{children}</p>; }
function PageHero({ title, sub }){
  return (<div className="text-center max-w-3xl mx-auto pt-4 pb-2 fade-up">
    <h1 className="display text-white text-3xl sm:text-5xl leading-[1.05] drop-shadow-lg" style={{fontWeight:800}}>{title}</h1>
    {sub && <p className="text-white/90 text-base sm:text-lg mt-5 drop-shadow leading-relaxed max-w-2xl mx-auto">{sub}</p>}
  </div>);
}
function Hadith({ arabic, translation, source, note }){
  return (<div className="rounded-2xl p-4 sm:p-5" style={{background:FIELD, borderLeft:'3px solid '+ROSE}}>
    <p className="serif text-right text-xl sm:text-2xl leading-loose" dir="rtl" style={{color:INK}}>{arabic}</p>
    <p className="text-[15px] mt-3 italic" style={{color:INK}}>“{translation}”</p>
    <p className="mono text-[10px] mt-2" style={{color:INK_MUTED, letterSpacing:'0.06em'}}>{source}</p>
    {note && <p className="text-[14px] mt-3 leading-relaxed" style={{color:INK_MUTED}}>{note}</p>}
  </div>);
}
function CTASection({ heading, lead, setPage }){
  return (<Panel className="text-center">
    <H2>{heading}</H2>
    <div className="mt-2"><Lead>{lead}</Lead></div>
    <button onClick={()=>setPage('home')} className="mt-5 text-white text-[15px] font-semibold px-7 py-3.5 rounded-2xl transition-transform hover:-translate-y-0.5" style={{background:ULTRA}}>Find your Nasib&nbsp;→</button>
    <div className="mono text-[11px] mt-4" style={{color:INK_MUTED, letterSpacing:'0.14em', textTransform:'uppercase'}}>Certainty first · Chemistry last</div>
  </Panel>);
}
function PageWrap({ children }){ return <div className="w-full max-w-3xl mx-auto flex flex-col gap-5 pb-14 fade-up">{children}</div>; }

/* ───────────────────────── Nav (router) ───────────────────────── */
function Nav({ page, setPage }){
  const [open,setOpen]=useState(false);
  const go=(k)=>{ setPage(k); setOpen(false); };
  return (
    <nav className="bg-white/65 backdrop-blur-md rounded-2xl shadow-sm pl-3 sm:pl-4 pr-2 py-2 w-full sm:w-auto flex items-center gap-3 sm:gap-6 self-start z-30 relative">
      <button onClick={()=>go('home')} className="flex items-center gap-2 shrink-0">
        <img src="./assets/logo.png" alt="Muslim Matching" className="shrink-0" style={{height:28, width:'auto', display:'block'}}/>
        <span className="display text-[15px] text-gray-900 whitespace-nowrap">Muslim Matching</span>
      </button>
      {/* desktop tabs */}
      <div className="hidden md:flex items-center gap-5">
        {TABS.map(([k,l])=>(
          <button key={k} onClick={()=>{if(k==='blog'){location.href='/blog/';return;}setPage(k);}} className="text-sm transition-opacity whitespace-nowrap pb-0.5"
            style={ page===k ? {color:INK, fontWeight:600, borderBottom:'2px solid '+INK} : {color:'#374151', fontWeight:500} }>{l}</button>
        ))}
      </div>
      {/* desktop CTA */}
      <button onClick={()=>go('home')} className="hidden md:block md:ml-auto text-white text-sm font-medium px-4 sm:px-5 py-2 rounded-xl hover:opacity-90 transition-opacity whitespace-nowrap" style={{background:INK}}>Find your Nasib</button>
      {/* mobile hamburger */}
      <button onClick={()=>setOpen(o=>!o)} className="md:hidden ml-auto p-2 rounded-lg" aria-label="Menu" aria-expanded={open}>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1A2E" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={open ? "M6 6l12 12M18 6 6 18" : "M3 6h18M3 12h18M3 18h18"}/></svg>
      </button>
      {/* mobile dropdown */}
      {open && (
        <div className="md:hidden absolute left-0 right-0 top-full mt-2 bg-white rounded-2xl shadow-xl p-2 flex flex-col gap-0.5 z-40" style={{border:'1px solid '+DIVIDER}}>
          {TABS.map(([k,l])=>(
            <button key={k} onClick={()=>{if(k==='blog'){location.href='/blog/';return;}go(k);}} className="text-left text-[15px] px-3.5 py-3 rounded-xl transition-colors"
              style={ page===k ? {background:'#F3F2F8', color:INK, fontWeight:600} : {color:'#374151', fontWeight:500} }>{l}</button>
          ))}
          <button onClick={()=>go('home')} className="mt-1 text-white text-[15px] font-semibold px-4 py-3 rounded-xl text-center" style={{background:INK}}>Find your Nasib</button>
        </div>
      )}
    </nav>
  );
}

/* ───────────────────────── HOME — the Find-your-Nasib funnel ───────────────────────── */
function HomeFunnel(){
  const [gender,setGender]=useState("brother");
  const [skin,setSkin]=useState(SKIN[2]);
  const [hair,setHair]=useState(HAIR[0]);
  const [beard,setBeard]=useState("Sunnah length");
  const [covering,setCover]=useState("");
  const [hijabStyle,setHS]=useState("Full");
  const [dressing,setDress]=useState("");
  const [makeup,setMakeup]=useState("");
  const [step,setStep]=useState("build");
  const [email,setEmail]=useState("");
  const [sending,setSending]=useState(false);
  const [hp,setHp]=useState("");       // honeypot — bots fill it, humans never see it
  const [error,setError]=useState("");

  const isSister = gender==="sister";
  const accent = isSister ? ROSE : ULTRA;
  const effDress = dressing || (isSister?"Dresses":"Western");
  const showFace = covering==="Hijab" || covering==="Niqab";
  const me = { gender, skinTone:skin, hairColor:hair, beard, covering:isSister?(covering||null):null, hijabStyle };

  const submit = async (e)=>{
    e.preventDefault();
    const addr = (email||"").trim();
    if(hp) return;                                                          // honeypot → silently drop bots
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)){ setError("Please enter a valid email."); return; }
    setError(""); setSending(true);
    try{
      const r = await fetch(SUBSCRIBE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:addr})});
      if(!r.ok) throw new Error('subscribe_failed');
      setStep("done");
    }catch(err){ setError("Hmm — that didn’t go through. Try again in a moment."); }
    finally{ setSending(false); }
  };

  return (
    <>
      <div className="flex-1 min-h-[1.5rem] lg:hidden" />
      <div className="flex flex-col gap-6 lg:contents">
        <p className="text-white text-3xl sm:text-4xl xl:text-5xl font-medium leading-tight shrink-0 display lg:absolute lg:left-8 lg:bottom-8 lg:max-w-[44%] lg:z-10" style={{fontWeight:700, textShadow:'0 2px 24px rgba(0,0,0,0.6)'}}>
          Find your spouse<br/>for <span className="serif italic" style={{fontWeight:400}}>Jannah</span>, <span className="serif italic text-white/90" style={{fontWeight:400}}>in shā’ Allah.</span>
        </p>

        <div id="nasib" className="w-full lg:absolute lg:top-6 lg:bottom-6 lg:right-6 lg:w-[min(456px,42%)] z-20">
          <div className="bg-white rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden p-4 sm:p-5 flex flex-col gap-4 lg:h-full lg:overflow-y-auto nasib-scroll">

            {step==="build" && (
              <div className="flex flex-col gap-4 fade-up" key="build">
                <div className="flex gap-1.5 p-1 rounded-2xl" style={{background:FIELD}}>
                  {[["brother","Brother",ULTRA],["sister","Sister",ROSE]].map(([id,lab,col])=>{
                    const on = gender===id;
                    return <button key={id} onClick={()=>setGender(id)} className="flex-1 text-sm font-semibold py-2.5 rounded-xl transition-all" style={ on ? {background:col,color:"#fff"} : {color:INK_MUTED} }>{lab}</button>;
                  })}
                </div>
                <div>
                  <h2 className="display text-xl sm:text-2xl" style={{fontWeight:800, color:INK}}>Build your avatar.</h2>
                  <p className="text-[13px] mt-0.5" style={{color:INK_MUTED}}>How do you present yourself as a Muslim?</p>
                </div>
                <div className="flex gap-3 sm:gap-4">
                  <div className="shrink-0 rounded-2xl flex items-center justify-center" style={{width:124,height:138,background:'#fff',border:'1px solid '+DIVIDER}}><Glyph {...me} size={100}/></div>
                  <div className="flex-1 flex flex-col justify-center gap-3">
                    <div><FieldLabel>Skin tone</FieldLabel><div className="flex justify-between">{SKIN.map(c=> <Swatch key={c} color={c} selected={skin===c} accent={accent} onPick={()=>setSkin(c)}/>)}</div></div>
                    <div><FieldLabel>Hair colour</FieldLabel><div className="flex justify-between">{HAIR.map(c=> <Swatch key={c} color={c} selected={hair===c} accent={accent} onPick={()=>setHair(c)}/>)}</div></div>
                  </div>
                </div>
                <div className="rounded-2xl flex flex-col gap-3 p-3" style={{background:FIELD, border:'1px solid '+DIVIDER}}>
                  {isSister ? (
                    <>
                      <div>
                        <FieldLabel>{covering==="Hijab" ? "How you wear it" : "Covering"}</FieldLabel>
                        <div className="flex gap-2">
                          {covering==="Hijab" ? (
                            <>
                              <Tile dim clear label="Hijab" accent={accent} onPick={()=>setCover("")} onClear={()=>setCover("")}><Glyph gender="sister" skinTone={skin} hairColor={hair} covering="Hijab" hijabStyle={hijabStyle} size={38}/></Tile>
                              {HIJAB_STYLES.map(s=> <Tile key={s} label={s} selected={hijabStyle===s} accent={accent} onPick={()=>setHS(s)}><Glyph gender="sister" skinTone={skin} hairColor={hair} covering="Hijab" hijabStyle={s} size={40}/></Tile>)}
                            </>
                          ) : COVERING.map(c=> <Tile key={c} label={c} selected={covering===c} accent={accent} clear={covering===c} onClear={()=>setCover("")} onPick={()=>setCover(covering===c?"":c)}><Glyph gender="sister" skinTone={skin} hairColor={hair} covering={c} size={48}/></Tile>)}
                        </div>
                      </div>
                      <div>
                        <FieldLabel>Dressing</FieldLabel>
                        <div className="flex gap-2">{DRESSING.map(d=> <Tile key={d} label={d} selected={effDress===d} accent={accent} onPick={()=>setDress(effDress===d?"":d)}><DressIcon kind={d} color={effDress===d?accent:INK} female={true}/></Tile>)}</div>
                      </div>
                      {showFace && (
                        <div className="fade-up"><FieldLabel>{covering==="Niqab" ? "Eyeliner/Mascara outside" : "Makeup outside"}</FieldLabel>
                          <div className="flex gap-2">{YESNO.map(yn=> <Chip key={yn} label={yn} selected={makeup===yn} accent={accent} onPick={()=>setMakeup(yn)}/>)}</div></div>
                      )}
                    </>
                  ) : (
                    <>
                      <div><FieldLabel>Beard</FieldLabel><div className="flex gap-2">{BEARDS.map(b=> <Tile key={b.key} label={b.label} selected={beard===b.key} accent={accent} onPick={()=>setBeard(b.key)}><Glyph gender="brother" skinTone={skin} hairColor={hair} beard={b.key} size={42}/></Tile>)}</div></div>
                      <div><FieldLabel>Dressing</FieldLabel><div className="flex gap-2">{BRO_DRESSING.map(d=> <Tile key={d} label={d} selected={effDress===d} accent={accent} onPick={()=>setDress(effDress===d?"":d)}><DressIcon kind={d} color={effDress===d?accent:INK} female={false}/></Tile>)}</div></div>
                    </>
                  )}
                </div>
                <p className="text-[11px] text-center leading-snug" style={{color:INK_MUTED}}>Attraction is more than looks. We don’t do pictures — the real you comes through in a call or meeting with your walī.</p>
                <button onClick={()=>setStep("email")} className="w-full text-white text-[15px] font-semibold py-3.5 rounded-2xl transition-transform hover:-translate-y-0.5" style={{background:accent}}>Find your Nasib&nbsp;→</button>
              </div>
            )}

            {step==="email" && (
              <form onSubmit={submit} className="flex flex-col gap-4 fade-up" key="email">
                <button type="button" onClick={()=>setStep("build")} className="self-start text-[13px]" style={{color:INK_MUTED}}>← Back to your avatar</button>
                <div className="flex items-center gap-3">

    "I had the sincerity. I did not have the knowledge. So I did it the way the people around me did it: getting to know a woman mostly by texting, then a long engagement, with the walī brought in late and the whole process upside down. There were cultural conditions stacked on top — owning an apartment first, a drawn-out engagement, even a wedding with music. None of it sat right, and it did not work out. What does not start right does not end right.",
    "As a revert, I had no family who could ask around for me, and my friends were recent and scattered across the world. So I started paying attention. I talked to Muslims from Egypt, Pakistan, Indonesia, Tanzania, Syria, India — and it was the same story everywhere. Reverts with no community to vouch for them. Born Muslims told they are ‘not ready yet,’ or boxed in by cultural conditions that have nothing to do with the deen. And online, the same broken loop for all of them: a profile, then a chat, then attachment, then wasted years.",
    "So I built Muslim Matching. A real process that gets you sure, the halal way, and a meeting where the only thing left is chemistry. No chat. No calls. No pictures. Free to find, vet, decide, and bring your walī in — we charge only for Premium, never for the path to nikah, because the goal is to get you married, not to keep you here.",
    "This is the thing I wish existed when I needed it. I hope it saves you the time it cost me.",
  ];
  return (
    <PageWrap>
      <PageHero title="I built the thing I wish existed." />
      <Panel>
        <Eyebrow>From the founder</Eyebrow>
        <div className="flex flex-col gap-4 mt-2">
          {PARAS.map((p,i)=> <p key={i} className="text-[15px] sm:text-base leading-relaxed" style={{color:i===0?INK:INK_MUTED}}>{p}</p>)}
        </div>
        <div className="mono text-[12px] mt-5" style={{color:INK,letterSpacing:'0.06em'}}>— The founder, Muslim Matching</div>
      </Panel>
      <Panel className="text-center">
        <H2>We never paywall the path to nikah.</H2>
        <div className="mt-2 max-w-xl mx-auto"><Lead>Find, vet, decide, and bring your walī in — always free. Premium only opens the inbound side. That is the whole model.</Lead></div>
      </Panel>
      <CTASection heading="Be first in." lead="If you have been waiting for someone to take this as seriously as you do, you can stop waiting." setPage={setPage} />
    </PageWrap>
  );
}

function Blog({ setPage }){
  const POSTS = [
    ["The market","Why the apps are built to keep you single","A solved customer is a lost customer. The quiet incentive behind every swipe — and why the math only works if you never marry.",6],
    ["Attachment","Chatting does not make you sure. It makes you attached.","Movement is not progress. How a chat box builds the same dopamine as the thing it replaces, and traps you in the wrong choice.",5],
    ["The bind","Why she will not bring you to her walī yet","The bind every serious sister knows — she can’t vet from a profile that lies, and won’t vet through a chat that shouldn’t happen.",7],
    ["History","Thirty years, one chat box, and a worse result","The short, strange history of online Muslim matchmaking: the listing, the group, the swipe, and the structure we threw away.",4],
  ];
  return (
    <PageWrap>
      <PageHero title="The Blog." sub="Things nobody else will say. Honest writing on marriage, the deen, and why getting to know someone online quietly broke. No pieces published yet — join the waitlist and the first ones land in your inbox." />
      <div className="text-center -mt-1">
        <button onClick={()=>setPage('home')} className="text-white text-sm font-semibold px-6 py-2.5 rounded-xl transition-transform hover:-translate-y-0.5" style={{background:ULTRA}}>Subscribe — join the waitlist</button>
      </div>
      <div className="rounded-3xl shadow-xl overflow-hidden backdrop-blur-md" style={{background:'rgba(255,255,255,0.97)'}}>
        {POSTS.map(([cat,t,d,read],i)=>(
          <div key={i} className="px-5 sm:px-8 py-6 transition-colors hover:bg-gray-50" style={ i>0 ? {borderTop:'1px solid '+DIVIDER} : {} }>
            <h3 className="display text-xl sm:text-2xl leading-tight" style={{fontWeight:800,color:INK}}>{t}</h3>
            <p className="text-[15px] mt-2 leading-relaxed" style={{color:INK_MUTED}}>{d}</p>
            <div className="flex items-center gap-2.5 mt-3 text-[12px]" style={{color:'#9b9aa8'}}>
              <span className="mono" style={{letterSpacing:'0.08em',textTransform:'uppercase'}}>{cat}</span>
              <span>·</span><span>{read} min read</span><span>·</span>
              <span style={{color:ULTRA,fontWeight:600}}>Coming soon</span>
            </div>
          </div>
        ))}
      </div>
      <CTASection heading="Get the first pieces." lead="Join the waitlist and we’ll send them as they go out." setPage={setPage} />
    </PageWrap>
  );
}

/* ───────────────────────── Shell + App ───────────────────────── */
function Shell({ page, setPage, locked, children }){
  return (
    <div id="top" className="min-h-screen bg-white p-3 sm:p-4 md:p-6">
      <div className={"relative rounded-2xl sm:rounded-3xl overflow-hidden shadow-sm min-h-[calc(100vh-24px)] sm:min-h-[calc(100vh-32px)] md:min-h-[calc(100vh-48px)] "+(locked?"lg:h-[calc(100vh-48px)]":"")}
           style={{background:"linear-gradient(165deg,#cfe0f4 0%,#eaf0f7 45%,#e3ead9 100%)"}}>
        <video className="absolute inset-0 w-full h-full object-cover" autoPlay muted loop playsInline poster="./assets/hero-poster.jpg"><source src={VIDEO_URL} type="video/mp4" /></video>
        <div className="absolute inset-0 scrim" style={ locked ? {} : {background:'linear-gradient(to bottom, rgba(8,8,20,.66) 0%, rgba(8,8,20,.80) 55%, rgba(8,8,20,.88) 100%)'} }></div>
        <div className={"relative z-10 flex flex-col gap-6 p-4 sm:p-6 md:p-8 min-h-[calc(100vh-24px)] sm:min-h-[calc(100vh-32px)] md:min-h-[calc(100vh-48px)] "+(locked?"lg:h-full":"")}>
          <Nav page={page} setPage={setPage} />
          {children}
        </div>
      </div>
    </div>
  );
}
function App(){
  const [page,setPage] = useState("home");
  const locked = page === "home";
  return (
    <Shell page={page} setPage={setPage} locked={locked}>
      {page==="home" && <HomeFunnel/>}
      {page==="how" && <HowItWorks setPage={setPage}/>}
      {page==="revolution" && <Revolution setPage={setPage}/>}
      {page==="pricing" && <Pricing setPage={setPage}/>}
      {page==="story" && <Story setPage={setPage}/>}
      {page==="blog" && <Blog setPage={setPage}/>}
    </Shell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
