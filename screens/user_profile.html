<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, height=852, initial-scale=1.0">
    <title>user_profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <style>
        :root {
            --mm-blue: #1E3FF5;
            --mm-ink: #1A1A2E;
            --mm-white: #FFFFFF;
            --mm-brown: #5D3A1A;
            --mm-tan: #FFB35B;
        }

        .iphone-frame {
            width: 393px;
            height: 852px;
            background-color: #ffffff;
            position: relative;
            border-radius: 0px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 0 auto;
        }

        .brand-heading {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-weight: 900;
            line-height: 1.1;
        }

        .neo-border {
            border: 3px solid var(--mm-ink);
        }

        .neo-shadow {
            box-shadow: 6px 6px 0px 0px var(--mm-ink);
        }

        .active-press:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px var(--mm-ink);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .header-arc {
            background: var(--mm-blue);
            border-bottom: 3px solid var(--mm-ink);
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }
    </style>
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P8EQRTMVTN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-P8EQRTMVTN');
</script>
</head>
<body class="bg-white font-sans text-[var(--mm-ink)]">
    <div class="iphone-frame flex flex-col">
        
        <!-- #header_001 -->
        <header class="flex-shrink-0 header-arc px-6 pt-10 pb-12 z-20 flex flex-col items-center gap-2">
            <div class="bg-white p-2 rounded-xl neo-border">
                <img src="https://media.screensdesign.com/afca/5275b151bc934308bcaa0f0a576f780a_WhatsApp_Image_2026-05-23_at_02.41.35.png" data-media-ref="asset:17719" alt="[background-removed from asset:17718]" class="h-8 w-auto">
            </div>
            <span class="text-white font-black uppercase text-[10px] tracking-[0.2em]">Your Sanctuary</span>
        </header>
        <!-- /#header_001 -->

        <!-- #scroll-content_002 -->
        <div class="flex-1 overflow-y-auto px-6 pt-4 pb-8 hide-scrollbar space-y-6">
            
<!-- #status-banner_003 -->
<div class="bg-[var(--mm-brown)] neo-border p-3 flex items-center justify-center gap-2 rounded-xl">
<iconify-icon icon="solar:clock-circle-bold" class="text-[var(--mm-tan)] text-xl"></iconify-icon>
<span class="text-[var(--mm-tan)] font-black uppercase text-[10px] tracking-widest">Your profile changes are pending review</span>
</div>
<!-- #completion-banner_010 -->
<div class="bg-[#FEF9C3] border-2 border-[#EAB308] p-3 flex items-center justify-between rounded-xl">
<div class="flex items-center gap-2">
<iconify-icon icon="ph:info-bold" class="text-[#854D0E] text-xl"></iconify-icon>
<span class="text-[#854D0E] font-black uppercase text-[10px] tracking-tight">Profile 12% complete · Matches are weaker until you finish</span>
</div>
<iconify-icon icon="ph:caret-right-bold" class="text-[#854D0E]"></iconify-icon>
</div>
            <!-- /#status-banner_003 -->

            <!-- #profile-summary_004 -->
            <section class="flex items-center gap-5">
                <div class="relative">
                    <!-- #avatar-container_005 -->
                    <div class="w-24 h-24 rounded-full bg-slate-50 neo-border overflow-hidden ring-4 ring-[var(--mm-blue)] ring-offset-2 flex items-center justify-center">
                        <iconify-icon icon="solar:user-circle-bold" class="text-6xl text-[var(--mm-blue)]"></iconify-icon>
                    </div>
                    <!-- /#avatar-container_005 -->
                </div>
                <div class="flex flex-col gap-1">
                    <h2 class="brand-heading text-2xl uppercase tracking-tighter">AbdullahGerman</h2>
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] font-black uppercase opacity-40">Revert</span>
                        <div class="w-1 h-1 bg-gray-300 rounded-full"></div>
                        <span class="text-[11px] font-black uppercase opacity-40">M28070</span>
                    </div>
                    <button class="mt-2 bg-[var(--mm-blue)] text-white font-black uppercase text-[10px] tracking-widest py-2 px-4 rounded-full neo-border neo-shadow active-press flex items-center gap-2">
                        <iconify-icon icon="solar:pen-bold"></iconify-icon>
                        Edit Profile
                    </button>
                </div>
            </section>
            <!-- /#profile-summary_004 -->

            <!-- #requests-card_006 -->
            <div class="w-full bg-[var(--mm-ink)] p-5 rounded-[32px] flex items-center justify-between border-b-4 border-r-4 border-blue-900">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-[var(--mm-blue)] rounded-full flex items-center justify-center">
                        <iconify-icon icon="solar:star-bold" class="text-white text-xl"></iconify-icon>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-white text-lg font-black uppercase leading-tight">10 Requests Left</span>
                        <span class="text-white/40 text-[9px] font-bold uppercase tracking-widest">Use them wisely</span>
                    </div>
                </div>
                <button class="bg-[var(--mm-blue)] text-white text-[9px] font-black px-4 py-2 rounded-lg uppercase border border-white/20 active:scale-95">Buy More</button>
            </div>
            <!-- /#requests-card_006 -->

            <!-- #visibility-toggle_007 -->
            <div class="flex items-center justify-between px-2 pt-2">
                <div class="flex flex-col">
                    <h3 class="brand-heading text-lg uppercase">Profile Hidden</h3>
                    <p class="text-[10px] font-bold text-gray-400 uppercase">This is how others see you</p>
                </div>
                <!-- Neo-Brutalist Switch -->
                <button class="w-14 h-8 bg-gray-200 neo-border rounded-full relative">
                    <div class="absolute left-1 top-1 w-5 h-5 bg-white neo-border rounded-full"></div>
                </button>
            </div>
            <!-- /#visibility-toggle_007 -->

            <!-- #stats-grid_008 -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Stat Item 1 -->
                <div class="bg-white neo-border p-4 rounded-2xl neo-shadow flex flex-col gap-3 active-press">
                    <iconify-icon icon="solar:calendar-bold" class="text-2xl text-[var(--mm-blue)]"></iconify-icon>
                    <span class="brand-heading text-sm uppercase">23 Years Old</span>
                </div>
                <!-- Stat Item 2 -->
                <div class="bg-white neo-border p-4 rounded-2xl neo-shadow flex flex-col gap-3 active-press">
                    <iconify-icon icon="solar:map-point-bold" class="text-2xl text-[var(--mm-blue)]"></iconify-icon>
                    <span class="brand-heading text-sm uppercase">Berlin, Germany</span>
                </div>
                <!-- Stat Item 3 -->
                <div class="bg-white neo-border p-4 rounded-2xl neo-shadow flex flex-col gap-3 active-press">
                    <iconify-icon icon="solar:ruler-bold" class="text-2xl text-[var(--mm-blue)]"></iconify-icon>
                    <span class="brand-heading text-sm uppercase">180 cm</span>
                </div>
                <!-- Stat Item 4 -->
                <div class="bg-white neo-border p-4 rounded-2xl neo-shadow flex flex-col gap-3 active-press">
                    <iconify-icon icon="mdi:weights" class="text-2xl text-[var(--mm-blue)]"></iconify-icon>
                    <span class="brand-heading text-sm uppercase">70 kg</span>
                </div>
                <!-- Stat Item 5 - Full Width Row -->
                <div class="col-span-2 bg-white neo-border p-4 rounded-2xl neo-shadow flex items-center gap-4 active-press">
                    <iconify-icon icon="solar:user-bold" class="text-2xl text-[var(--mm-blue)]"></iconify-icon>
                    <span class="brand-heading text-sm uppercase">Well Proportioned</span>
                </div>
            </div>
            <!-- /#stats-grid_008 -->

        </div>
        <!-- /#scroll-content_002 -->

        <!-- #footer_nav_009 -->
        <footer class="flex-shrink-0 h-24 border-t-4 border-[var(--mm-ink)] px-8 flex justify-between items-center bg-white pb-6 z-30">
            <button class="active:opacity-50">
                <iconify-icon icon="ph:heart-bold" class="text-2xl text-gray-300"></iconify-icon>
            </button>
            <button class="active:opacity-50">
                <iconify-icon icon="ph:squares-four-bold" class="text-2xl text-gray-300"></iconify-icon>
            </button>
            <button class="active:opacity-50">
                <iconify-icon icon="ph:chat-circle-text-bold" class="text-2xl text-gray-300"></iconify-icon>
            </button>
            <button class="active:opacity-50">
                <iconify-icon icon="ph:bell-bold" class="text-2xl text-gray-300"></iconify-icon>
            </button>
            <div class="flex flex-col items-center gap-1">
                <iconify-icon icon="ph:user-fill" class="text-2xl text-[var(--mm-blue)]"></iconify-icon>
                <div class="w-1 h-1 bg-[var(--mm-blue)] rounded-full"></div>
            </div>
        </footer>
        <!-- /#footer_nav_009 -->

    </div>
</body>
</html>
