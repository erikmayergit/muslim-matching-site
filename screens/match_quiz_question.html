<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
--mm-blue: #1E3FF5;
--mm-rose: #E84A78;
--mm-ink: #1A1A2E;
--mm-white: #FFFFFF;
}
.iphone-frame {
width: 393px;
height: 852px;
background-color: #ffffff;
position: relative;
border-radius: 0px;
box-shadow: 0 0 20px rgba(0,0,0,0.1);
overflow: hidden;
margin: 0 auto;
}
.neo-border {
border: 3px solid var(--mm-ink);
}
.neo-shadow {
box-shadow: 6px 6px 0px 0px var(--mm-ink);
}
.arc-container-small {
position: relative;
height: 120px;
background-color: var(--mm-blue);
clip-path: ellipse(110% 80% at 50% 0%);
}
.headline-massive {
line-height: 0.85;
letter-spacing: -0.04em;
}
.active-press:active {
transform: translate(3px, 3px);
box-shadow: 3px 3px 0px 0px var(--mm-ink);
}
.hide-scrollbar::-webkit-scrollbar {
display: none;
}
.hide-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
.option-card {
padding: 12px 16px;
border: 2px solid var(--mm-ink);
border-radius: 12px;
font-size: 13px;
font-weight: 900;
text-transform: uppercase;
transition: all 0.2s;
background: white;
}
.option-selected {
background-color: var(--mm-blue) !important;
color: white !important;
border-color: var(--mm-ink);
box-shadow: 3px 3px 0px 0px var(--mm-ink);
}

<div class="arc-container-small flex items-center justify-center">

</div>
</div>
