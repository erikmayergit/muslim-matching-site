<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, height=852, initial-scale=1.0">
<title>discovery_swipe</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
:root {
--mm-blue: #1E3FF5;
--mm-rose: #E84A78;
--mm-ink: #1A1A2E;
--mm-white: #FFFFFF;
--mm-gold: #FFC107;
}
.iphone-frame {
width: 393px;
height: 852px;
background-color: #ffffff;
position: relative;
border-radius: 0px;
box-shadow: 0 0 20px rgba(0,0,0,0.1);
overflow: hidden;
margin: 0 auto;
}
.brand-heading {
font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
font-weight: 900;
line-height: 1.1;
}
.neo-border {
border: 3px solid var(--mm-ink);
}
.hide-scrollbar::-webkit-scrollbar {
display: none;
}
.hide-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
/* Enhanced Blue Background from Reference */
.blue-hero-bg {
background: linear-gradient(180deg, #3B5AFF 0%, #1E3FF5 100%);
position: relative;
}
.blue-hero-bg::before {
content: "";
position: absolute;
inset: 0;
background-image: url("data:image/svg+xml,%3Csvg width='393' height='640' viewBox='0 0 393 640' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M393 200C393 400 200 500 100 400C0 300 0 100 100 0C200 -100 393 0 393 200Z' fill='white' fill-opacity='0.05'/%3E%3C/svg%3E");
background-size: cover;
opacity: 0.1;
pointer-events: none;
}
.emoji-circle {
width: 180px;
height: 180px;
background: white;
border: 3px solid var(--mm-blue);
border-radius: 100%;
display: flex;
align-items: center;
justify-content: center;
box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}
.info-overlay-blue {
background: linear-gradient(to top, rgba(30, 63, 245, 1) 0%, rgba(30, 63, 245, 0.4) 60%, transparent 100%);
}
</style>
</head>
<body class="bg-gray-50 font-sans text-[var(--mm-ink)]">
<div class="iphone-frame flex flex-col bg-white">
<!-- #header_001 -->
<header class="flex-shrink-0 px-6 pt-6 pb-2 flex items-center justify-between z-30 bg-white">
<div class="flex items-center gap-3">
<img src="https://media.screensdesign.com/afca/5275b151bc934308bcaa0f0a576f780a_WhatsApp_Image_2026-05-23_at_02.41.35.png" data-media-ref="asset:17719" alt="Muslim Matching Logo" class="h-8 w-auto">
</div>
<div class="flex items-center gap-2">
<button class="w-10 h-10 bg-white neo-border rounded-xl flex items-center justify-center active:scale-95 transition-transform">
<iconify-icon icon="ph:sliders-horizontal-bold" class="text-xl"></iconify-icon>
</button>
</div>
</header>
<!-- /#header_001 -->

<!-- #scroll-container_002 -->
<div class="flex-1 overflow-y-auto hide-scrollbar px-4 pt-2">
<!-- #profile-card-container_003 -->
<div class="w-full neo-border rounded-[44px] overflow-hidden bg-white mb-6">
<!-- #hero-section_004 -->
<div class="relative h-[640px] blue-hero-bg overflow-hidden flex flex-col">
<!-- Emoji Hero - Adjusted centering -->
<div class="flex-1 flex flex-col items-center justify-center pt-8">
<div class="emoji-circle relative">
<iconify-icon icon="game-icons:beard" class="text-[100px] text-[var(--mm-blue)]"></iconify-icon>
<!-- Identity Badge / Verification -->
<div class="absolute -bottom-2 -right-2 w-14 h-14 bg-[var(--mm-blue)] rounded-full border-4 border-white flex items-center justify-center shadow-lg">
<iconify-icon icon="solar:verified-check-bold" class="text-2xl text-white"></iconify-icon>
</div>
</div>
</div>

<!-- Identity Details -->
<div class="p-8 text-white">
<div class="flex items-center gap-2 mb-1">
<iconify-icon icon="ph:map-pin-fill" class="text-[var(--mm-blue)] bg-white rounded-full p-0.5 text-[10px]"></iconify-icon>
<span class="text-[11px] font-black uppercase tracking-widest opacity-90">Egypt</span>
</div>
<h2 class="brand-heading text-[54px] uppercase tracking-tighter leading-none mb-6">Omar, 28</h2>
<div class="w-full h-[1px] bg-white/20 mb-6"></div>

<!-- Expanded Looks Data Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col">
<span class="text-[9px] font-black uppercase tracking-widest opacity-60 mb-1">Height & Weight</span>
<span class="text-[14px] font-black uppercase">178 cm · 75 kg</span>
</div>
<div class="flex flex-col">
<span class="text-[9px] font-black uppercase tracking-widest opacity-60 mb-1">Tone & Build</span>
<span class="text-[14px] font-black uppercase">Olive · Lean Muscular</span>
</div>
</div>

<div class="mt-10 flex flex-col items-center gap-1 opacity-40">
<iconify-icon icon="ph:arrow-down-bold" class="text-lg animate-bounce"></iconify-icon>
<span class="text-[10px] font-black uppercase tracking-widest">Scroll for details</span>
</div>
</div>
</div>
<!-- /#hero-section_004 -->

<!-- #details-section_005 -->
<div class="p-8 space-y-10 bg-white">
<!-- Section: The Basics -->
<div class="space-y-6">
<div class="flex items-center gap-3">
<div class="h-[2px] flex-1 bg-gray-100"></div>
<h3 class="brand-heading text-xl uppercase tracking-tighter text-[var(--mm-blue)]">THE BASICS</h3>
<div class="h-[2px] flex-1 bg-gray-100"></div>
</div>
<div class="grid grid-cols-1 gap-6">
<!-- Marital Status -->
<div class="flex flex-col border-b border-gray-50 pb-4">
<span class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-1">Marital Status</span>
<div class="flex items-center gap-3">
<iconify-icon icon="mdi:ring" class="text-[var(--mm-blue)] text-xl"></iconify-icon>
<span class="text-lg font-black uppercase">Never Married</span>
</div>
</div>
<!-- Children -->
<div class="flex flex-col border-b border-gray-50 pb-4">
<span class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-1">Children</span>
<div class="flex items-center gap-3">
<iconify-icon icon="ph:baby-bold" class="text-[var(--mm-blue)] text-xl"></iconify-icon>
<span class="text-lg font-black uppercase">None</span>
</div>
</div>
<!-- Ethnicity -->
<div class="flex flex-col border-b border-gray-50 pb-4">
<span class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-1">Ethnicity</span>
<div class="flex items-center gap-3">
<iconify-icon icon="ph:globe-bold" class="text-[var(--mm-blue)] text-xl"></iconify-icon>
<span class="text-lg font-black uppercase">Egyptian</span>
</div>
</div>
<!-- Revert Status -->
<div class="flex flex-col border-b border-gray-50 pb-4">
<span class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-1">Revert Status</span>
<div class="flex items-center gap-3">
<iconify-icon icon="ph:star-bold" class="text-[var(--mm-blue)] text-xl"></iconify-icon>
<span class="text-lg font-black uppercase">Born Muslim</span>
</div>
</div>
<!-- Prayer Frequency -->
<div class="flex flex-col border-b border-gray-50 pb-4">
<span class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-1">Prayer Frequency</span>
<div class="flex items-center gap-3">
<iconify-icon icon="ph:mosque-bold" class="text-[var(--mm-blue)] text-xl"></iconify-icon>
<span class="text-lg font-black uppercase">Always (5x Daily)</span>
</div>
</div>
</div>
</div>
</div>
<!-- /#details-section_005 -->
</div>
<!-- /#profile-card-container_003 -->
</div>
<!-- /#scroll-container_002 -->

<!-- #footer_nav_007 -->
<footer class="flex-shrink-0 h-24 border-t-2 border-gray-100 px-8 flex justify-between items-center bg-white pb-6 z-30">
<div class="flex flex-col items-center gap-1">
<iconify-icon icon="ph:heart-fill" class="text-2xl text-[var(--mm-blue)]"></iconify-icon>
<div class="w-1 h-1 bg-[var(--mm-blue)] rounded-full"></div>
</div>
<button class="active:opacity-50">
<iconify-icon icon="ph:squares-four-bold" class="text-2xl text-gray-300"></iconify-icon>
</button>
<button class="active:opacity-50">
<iconify-icon icon="ph:chat-circle-text-bold" class="text-2xl text-gray-300"></iconify-icon>
</button>
<button class="active:opacity-50 relative">
<iconify-icon icon="ph:bell-bold" class="text-2xl text-gray-300"></iconify-icon>
<div class="absolute -top-1 -right-1 w-2 h-2 bg-[var(--mm-rose)] rounded-full"></div>
</button>
<button class="active:opacity-50">
<iconify-icon icon="ph:user-bold" class="text-2xl text-gray-300"></iconify-icon>
</button>
</footer>
<!-- /#footer_nav_007 -->
</div>
</body>
</html>
